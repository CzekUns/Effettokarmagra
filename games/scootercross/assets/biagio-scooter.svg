<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" role="img" aria-labelledby="t d">
<title id="t">Biagio Gelo sullo scooter bordeaux</title><desc id="d">Biagio con cappellino rosso, occhiali bianchi, maglietta blu, pantaloncini beige e tracolla nera guida uno scooter bordeaux con bauletto.</desc>
