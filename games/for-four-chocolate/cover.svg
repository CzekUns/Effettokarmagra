<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">For Four Chocolate — anteprima</title>
<desc id="desc">Supermercato ceco visto in prospettiva tattica, corsie di cioccolato, campi visivi delle telecamere e quattro tavolette.</desc>
