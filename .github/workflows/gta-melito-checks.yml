name: GTA Melito visual and campaign validation

on:
  push:
    branches: [main]
    paths:
      - 'games/gta-melito/**'
      - '.github/workflows/gta-melito-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check browser module syntax
        run: |
          node --check games/gta-melito/game.mjs
          node --check games/gta-melito/roads.mjs
          node --check games/gta-melito/visuals.mjs
          node --check games/gta-melito/osm.mjs
          node --check games/gta-melito/campaign.mjs
          node --check games/gta-melito/landmark-art.mjs
          node --check games/gta-melito/city-art.mjs
          node --check games/gta-melito/storefronts.mjs
      - name: Test graph topology, real map and traffic
        run: node --test games/gta-melito/*.test.mjs
